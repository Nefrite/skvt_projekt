# Výchozí konfigurace instance (zadání 13, kap. 4).
# Chybějící klíč v Maintenance/config.yaml = hodnota odsud; neznámý klíč = varování.
hestia_config: 1
game_layer: true                   # false = instance bez herní vrstvy (01 kap. 2, Q31)
instance: null                     # jméno instance pro source_instance v CR (export_cr); null = jméno složky projektu
project_root: ".."
core_source: null                  # repozitář HearthLore se značkami core relativně k vaultu (update_core --tag/--latest, 13 kap. 10.6)
code_roots: []
ignore: ["**/__pycache__/**", "**/_to_delete/**", "**/generated/**", "**/*.bak"]
prototypes: []
engine_version: null
thresholds:
  scratch_raw_days: 14
  stale_doc_days: 90
  open_question_days: 14
  knowhow_unverified_days: 180
  g11_step_entities: 5
  bulk_metadata_files: 10
required_docs: [lore_master]
protected_files: []
context_max_chars: 60000           # limit balíčku compose_context (13 kap. 10.10)
ue_report_days: 14                 # report z Unrealu starší než práh = starý (13 kap. 10.11)
doc_summary_chars: 6000            # nad prahem čtení po sekcích a povinný Souhrn (G14a, 13 kap. 10.13; zadání 0.21)
doc_split_chars: 20000             # nad prahem doporučení rozdělit dokument (G14b)
handover_max_chars: 4000           # předání nad prahem obsahuje víc než zadání (G14c)
